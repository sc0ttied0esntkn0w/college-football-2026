  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;}
  .label{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700;}
  .ptitle{font-size:13px;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:7px;}
  .tabbtn{position:relative;padding:13px 4px;font-weight:700;font-size:13.5px;color:var(--mut);transition:color .2s;cursor:pointer;background:none;border:none;}
  .tabbtn.active{color:#fff;}
  .tabbtn.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;border-radius:2px;background:var(--cyan);}
  .chip{display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;letter-spacing:.03em;padding:3px 6px;border-radius:5px;color:#fff;min-width:38px;}
  .pill{font-size:9px;font-weight:800;letter-spacing:.04em;padding:3px 7px;border-radius:5px;}
  .rchip{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;border-radius:6px;font-weight:800;font-size:12px;}
  .r-hi{background:rgba(54,211,153,.16);color:#36d399;} .r-md{background:rgba(255,255,255,.08);color:#cbd3df;} .r-lo{background:rgba(255,93,108,.16);color:#ff5d6c;}
  details{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:13px;}
  summary{list-style:none;cursor:pointer;outline:none;} summary::-webkit-details-marker{display:none;}
  .chev{transition:transform .2s;} details[open] .chev{transform:rotate(90deg);}
  table{border-collapse:collapse;width:100%;} a{text-decoration:none;}
  .seclabel{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;color:#fff;padding:4px 9px;border-radius:5px;display:inline-block;margin:14px 0 8px;}
  .drafterbtn{padding:8px 15px;font-size:12.5px;font-weight:700;border-radius:20px;border:1px solid var(--border);background:var(--panel);color:var(--mut);cursor:pointer;transition:all .15s;}
  .drafterbtn.active{background:var(--cyan);color:#04121f;border-color:var(--cyan);}
</style>
</head>

  '<div style="display:flex;align-items:center;gap:10px">'+tchip(m.a)+'<div><div style="font-size:9px;letter-spacing:.06em;color:var(--mut)">'+(m.tracked?'TRACKED &middot; ':'')+(m.meta?m.meta.split(' | ')[0]:'')+'</div><div style="font-size:15px;font-weight:900">'+m.a+' '+m.sa+'-'+m.sb+' '+m.b+'</div></div>'+tchip(m.b)+'</div>'+chev()+'</div></summary>'+body+'</details>';
}
function recapMini(m){var c=col(m.team);
 return '<div class="panel" style="padding:13px;display:flex;gap:12px;border-left:4px solid '+c.b+'"><div style="text-align:center;flex-shrink:0"><div style="font-size:18px;font-weight:900;color:'+c.d+';line-height:1">'+m.sa+'-'+m.sb+'</div></div><div><div style="font-size:12.5px;font-weight:800">'+m.a+' <span style="color:var(--mut)">v</span> '+m.b+' <span style="font-size:10px;color:var(--mut);font-weight:400">- '+m.date+'</span></div><p style="font-size:11.5px;color:var(--mut);margin-top:2px;line-height:1.5">'+m.note+'</p></div></div>';}
/* ---- Previews ---- */
function spreadBlock(s){function cell(t,inner){return '<div style="background:var(--panel2);border-radius:8px;padding:8px;text-align:center"><div class="label" style="margin-bottom:3px">'+t+'</div><div style="font-size:13px;font-weight:800;line-height:1.4">'+inner+'</div></div>';}
 return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+cell('Spread',fv(s[0],true))+cell('Total',nu(s[1]))+'</div><p style="font-size:10px;color:var(--mut);margin-top:5px">'+s[2]+'</p>';}
function injBlock2(arr){return '<div class="panel" style="padding:4px 12px">'+arr.map(function(x,i){var st=x[1];var clr=st==='out'?'var(--red)':(st==='doubt'?'var(--orange)':'var(--mut)');var lab=st==='out'?'OUT':(st==='doubt'?'DOUBT':'OK');
 return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;'+(i?'border-top:1px solid var(--line)':'')+'"><span style="font-size:11.5px"><b>'+x[0]+'</b></span><span class="pill" style="background:'+clr+'1f;color:'+clr+'">'+lab+'</span></div>';}).join('')+'</div>';}
function predBox(p,c){return '<div class="panel" style="padding:12px;text-align:center;border:1px solid '+c.b+'"><div class="label" style="margin-bottom:2px">Score Prediction</div><div style="font-size:16px;font-weight:900;color:'+c.d+'">'+p[0]+'</div><p style="font-size:11.5px;color:var(--mut);line-height:1.5;margin-top:5px">'+p[1]+'</p></div>';}
function previewCard(p){var c=col(p.team);var open=p.tracked?' open':'';
 var body='<div style="padding:6px 16px 16px">'+
  '<div style="text-align:center;margin:4px 0 6px"><div style="font-size:18px;font-weight:900">'+p.a+' <span style="color:var(--mut);font-weight:600">vs</span> '+p.b+'</div><div style="font-size:11px;color:'+c.d+';font-weight:700">'+p.tag+'</div><div style="font-size:10px;color:var(--mut)">'+p.meta+'</div></div>'+
  seclabel('Betting Line',c)+spreadBlock(p.spread)+
  seclabel('The Storyline',c)+'<p style="font-size:12px;line-height:1.6">'+p.storyline+'</p>'+
  seclabel('Keys to the Game',c)+'<ul style="margin:0;padding:0;list-style:none">'+p.keys.map(function(b){return '<li style="font-size:11.5px;color:var(--mut);padding:2px 0;padding-left:12px;position:relative"><span style="position:absolute;left:0;color:'+c.d+'">&bull;</span>'+b+'</li>';}).join('')+'</ul>'+
  seclabel('Injury Report',c)+'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><div style="font-size:11px;font-weight:700;margin-bottom:4px">'+p.a+'</div>'+injBlock2([p.injuries[0]])+'</div><div><div style="font-size:11px;font-weight:700;margin-bottom:4px">'+p.b+'</div>'+injBlock2([p.injuries[1]])+'</div></div>'+
  '<div style="margin-top:13px">'+predBox(p.pred,c)+'</div></div>';
 return '<details'+open+'><summary><div style="height:4px;background:'+c.b+'"></div><div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px">'+
  '<div style="display:flex;align-items:center;gap:10px">'+tchip(p.a)+'<div><div style="font-size:9px;letter-spacing:.06em;color:var(--mut)">'+(p.tracked?'TRACKED &middot; ':'')+p.tag+'</div><div style="font-size:15px;font-weight:900">'+p.a+' vs '+p.b+'</div></div>'+tchip(p.b)+'</div>'+chev()+'</div></summary>'+body+'</details>';
}
/* ---- Compact team lines (used by the Drafters tab for teams outside full coverage) ---- */
function compactLine(g){var cp=col(g[5]);
 return '<div class="panel" style="padding:11px 14px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;flex-wrap:wrap;gap:4px"><div style="display:flex;align-items:center;gap:7px">'+tchip(g[0])+'<span style="font-size:12.5px;font-weight:800">'+g[0]+'</span><span style="color:var(--mut);font-size:10.5px">at</span><span style="font-size:12.5px;font-weight:800">'+g[1]+'</span>'+tchip(g[1])+'</div><span class="label">'+g[2]+'</span></div>'+
  '<div style="font-size:10.5px;color:var(--mut);margin-bottom:5px">Line: '+g[3]+'</div><p style="font-size:11px;color:var(--txt);line-height:1.5">'+g[4]+'</p></div>';}
/* ---- Draft Pool standings (compact — lives at the bottom of Summary) ---- */
function draftMini(){
 var ranked=DRAFT.drafters.slice().sort(function(a,b){return b[2]-a[2];});
 var head='<tr style="color:var(--mut);font-size:9px;text-transform:uppercase"><th style="text-align:left;padding:3px 0">Drafter</th><th style="text-align:left">Teams</th><th style="text-align:right">Wins</th></tr>';
 var body=ranked.map(function(d,i){
  var teams=d[1].map(function(t){return t[0]==='TBD'?'TBD':ab(t[0]);}).join(', ');
  return '<tr style="border-top:1px solid var(--line)'+(i===0?';background:rgba(245,196,81,.07)':'')+'"><td style="text-align:left;padding:6px 0;font-size:12px;font-weight:800"><span style="color:'+(i===0?'var(--gold)':'var(--mut)')+'">'+(i+1)+'.</span> '+d[0]+'</td>'+
   '<td style="text-align:left;font-size:10px;color:var(--mut);padding:6px 4px">'+teams+'</td>'+
   '<td style="text-align:right;font-size:14px;font-weight:900;color:var(--green);padding:6px 0">'+d[2]+'</td></tr>';}).join('');
 return '<div class="panel" style="padding:13px 15px"><div class="ptitle" style="color:var(--gold);margin-bottom:4px">Draft Pool Standings <span style="font-size:10px;color:var(--mut);font-weight:600">winner-take-all &middot; most combined wins</span></div>'+
  '<p style="font-size:10.5px;color:var(--mut);line-height:1.5;margin-bottom:6px">'+DRAFT.status+'</p>'+
  '<table>'+head+body+'</table></div>';
}
/* ---- Drafters tab: 7-way switcher, one pane per drafter, each showing their 3 schools ---- */
function teamBlockForDrafter(team){
 if(team==='TBD')return '<div class="panel" style="padding:16px;text-align:center;color:var(--mut);font-size:12px;margin-bottom:8px">Pick not yet made.</div>';
 var rec=RECAPS.filter(function(m){return m.a===team||m.b===team;});
 var prev=PREVIEWS.filter(function(p){return p.a===team||p.b===team;});
 var compact=OTHER.filter(function(g){return g[0]===team||g[1]===team;});
 var html='<div style="margin-bottom:6px;display:flex;align-items:center;gap:8px">'+tchip(team)+'<span style="font-size:13px;font-weight:800">'+team+'</span></div>';
 if(rec.length)html+=rec.map(recapCard).join('');
 if(prev.length)html+=prev.map(previewCard).join('');
 if(!rec.length&&!prev.length){
  html+=compact.length?compact.map(compactLine).join(''):'<div class="panel" style="padding:16px;text-align:center;color:var(--mut);font-size:12px;margin-bottom:8px">No update yet this week.</div>';
 }
 return html;
}
function drafterPane(name){
 var d=DRAFT.drafters.filter(function(x){return x[0]===name;})[0];
 if(!d)return '';
 var teams=d[1].map(function(t){return teamBlockForDrafter(t[0]);}).join('<div style="height:4px"></div>');
 return '<div class="panel" style="padding:11px 14px;margin-bottom:14px;border-left:4px solid var(--gold);display:flex;align-items:center;justify-content:space-between"><div><span class="label" style="color:var(--gold)">Combined Wins</span><div style="font-size:24px;font-weight:900;color:var(--green)">'+d[2]+'</div></div><div style="font-size:10.5px;color:var(--mut);text-align:right;max-width:220px">'+DRAFT.metric+'</div></div>'+teams;
}
function draftersTab(){
 var switcher=DRAFT.drafters.map(function(d,i){return '<button class="drafterbtn'+(i===0?' active':'')+'" data-drafter="'+d[0]+'">'+d[0]+'</button>';}).join('');
 var panes=DRAFT.drafters.map(function(d,i){return '<div class="drafterpane'+(i===0?'':' hidden')+'" data-drafter="'+d[0]+'">'+drafterPane(d[0])+'</div>';}).join('');
 return '<div id="drafterSwitcher" style="position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;margin-bottom:4px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)">'+switcher+'</div>'+panes;
}

var AA={
 src:'ESPN 2026 Preseason All-America (first team)',
 offense:[
  ['QB','Julian Sayin','Ohio State'],['RB','Kewan Lacy','Ole Miss'],['RB','Jadan Baugh','Florida'],
  ['WR','Jeremiah Smith','Ohio State'],['WR','Cam Coleman','Texas'],['TE','Terrance Carter Jr.','Texas Tech'],
  ['OT','Trevor Goosby','Texas'],['OG','Kade Pieper','Iowa'],['C','Drew Bobo','Georgia'],
  ['OG','Anthonie Knapp','Notre Dame'],['OT','Carter Smith','Indiana'],['AP','Malachi Toney','Miami']
 ],
 defense:[
  ['EDGE','Colin Simmons','Texas'],['DT','A’Mauri Washington','Oregon'],['DT','Ahmad Moten','Miami'],
  ['EDGE','Dylan Stewart','South Carolina'],['LB','Rasheem Biles','Texas'],['LB','Xavier Atkins','Auburn'],
  ['LB','Sammy Brown','Clemson'],['CB','Leonard Moore','Notre Dame'],['CB','Brice Pollock','Texas Tech'],
  ['S','KJ Bolden','Georgia'],['S','Ty Benefield','LSU']
 ],
 special:[
  ['K','Tate Sandell','Oklahoma'],['P','Evan Crenshaw','Troy'],['RET','Ryan Niblett','Texas']
 ]
};
function aaGroup(title,arr,clr){
 var rows=arr.map(function(p,i){var c=col(p[2]);return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;'+(i?'border-top:1px solid var(--line)':'')+'"><span style="font-size:10px;font-weight:800;color:var(--mut);width:40px">'+p[0]+'</span>'+tchip(p[2])+'<div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:700">'+p[1]+'</div><div style="font-size:10px;color:'+c.d+'">'+p[2]+'</div></div></div>';}).join('');
 return '<div class="panel" style="padding:13px 15px"><div class="ptitle" style="color:'+clr+'">'+title+'</div>'+rows+'</div>';
}
function aaPanel(){
 return '<p style="font-size:11px;color:var(--mut);margin-bottom:12px">Preseason All-America first team &middot; source: '+AA.src+'. This is a preseason honor and stays fixed for the season; an in-season / postseason team can replace it later.</p>'+
  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">'+aaGroup('Offense',AA.offense,'var(--gold)')+aaGroup('Defense',AA.defense,'var(--cyan)')+'</div>'+
  aaGroup('Special Teams',AA.special,'var(--green)');
}

document.getElementById('tab-summary').innerHTML=statStrip()+
 '<div style="margin-bottom:12px">'+yourTeamsPanel()+'</div>'+
 '<div style="display:grid;grid-template-columns:1.15fr .85fr;gap:12px;margin-bottom:12px">'+rankingPanel()+storiesPanel()+'</div>'+
 cfpPanel()+
 '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px"><div>'+heismanPanel()+'</div><div>'+confPanel()+'</div></div>'+
 '<div style="margin-bottom:12px">'+injuriesPanel()+'</div>'+
 '<div style="margin-bottom:12px">'+draftMini()+'</div>'+
 '<div style="display:grid;gap:14px">'+
 '<div style="display:grid;grid-template-columns:1fr 1fr;gap:13px">'+
 '<div class="panel" style="padding:15px"><div class="ptitle" style="color:var(--gold);margin-bottom:4px">Top Storylines</div>'+NEWS.stories.map(function(s){return '<div style="padding:7px 0;border-top:1px solid var(--line)"><div style="font-size:13px;font-weight:800">'+s[0]+'</div><p style="font-size:11px;color:var(--mut);line-height:1.45;margin-top:2px">'+s[1]+'</p></div>';}).join('')+'</div>'+
 '<div class="panel" style="padding:15px"><div class="ptitle" style="color:var(--cyan);margin-bottom:4px">Watch &amp; Follow</div>'+NEWS.watch.map(function(w){return '<a href="'+w[1]+'" target="_blank" rel="noopener" style="display:block;padding:7px 0;border-top:1px solid var(--line)"><div style="font-size:13px;font-weight:700;color:var(--cyan)">'+w[0]+'</div><div style="font-size:10.5px;color:var(--mut)">'+w[2]+'</div></a>';}).join('')+'</div></div>'+
 '<div class="panel" style="padding:15px;border-left:4px solid var(--gold)"><div class="ptitle" style="color:var(--gold);margin-bottom:4px">What to Watch Next</div><p style="font-size:12px;line-height:1.6">'+NEWS.outlook+'</p></div></div>';
document.getElementById('tab-recaps').innerHTML=
 (typeof RECAPS_INTRO!=='undefined'?'<p style="font-size:11px;color:var(--mut);margin-bottom:12px">'+RECAPS_INTRO+'</p>':'')+
 (RECAPS.length?RECAPS.map(recapCard).join(''):'<div class="panel" style="padding:22px;text-align:center;color:var(--mut);font-size:12px">No games played yet. Recaps appear here after Week 1.</div>')+
 (RECAPS_MINI.length?'<div class="label" style="margin:16px 0 8px">Other Results</div><div style="display:grid;gap:10px">'+RECAPS_MINI.map(recapMini).join('')+'</div>':'');
document.getElementById('tab-previews').innerHTML=
 (typeof PREVIEWS_INTRO!=='undefined'?'<p style="font-size:11px;color:var(--mut);margin-bottom:12px">'+PREVIEWS_INTRO+'</p>':'')+
 (PREVIEWS.length?PREVIEWS.map(previewCard).join(''):'<div class="panel" style="padding:22px;text-align:center;color:var(--mut);font-size:12px">Previews populate each Sunday for the week ahead.</div>');
document.getElementById('tab-drafters').innerHTML=draftersTab();
document.getElementById('tab-aa').innerHTML=aaPanel();
var btns=document.querySelectorAll('.tabbtn');var map={summary:'tab-summary',drafters:'tab-drafters',recaps:'tab-recaps',previews:'tab-previews',aa:'tab-aa'};
btns.forEach(function(b){b.addEventListener('click',function(){btns.forEach(function(x){x.classList.remove('active');});b.classList.add('active');
 Object.keys(map).forEach(function(k){document.getElementById(map[k]).classList.add('hidden');});document.getElementById(map[b.dataset.tab]).classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});});});

dbtns.forEach(function(b){b.addEventListener('click',function(){dbtns.forEach(function(x){x.classList.remove('active');});b.classList.add('active');
 document.querySelectorAll('.drafterpane').forEach(function(p){p.classList.toggle('hidden',p.dataset.drafter!==b.dataset.drafter);});});});

 if(dsw&&hdr)dsw.style.top=hdr.offsetHeight+'px';}
syncStickyTop();window.addEventListener('resize',syncStickyTop);
