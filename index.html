<style>
  :root{--bg:#0b0f16;--panel:#141b26;--panel2:#1b2433;--border:#26334a;--line:#1f2a3a;--txt:#e8ebef;--mut:#8a94a4;--cyan:#4ea1ff;--green:#36d399;--red:#ff5d6c;--gold:#f5c451;--orange:#ff9d52;--purple:#a78bfa;}
  *{-webkit-font-smoothing:antialiased;box-sizing:border-box;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;}
  #brk .bslot{transition:opacity .2s;}
  #brk.focus .bslot{opacity:.2;}
  #brk.focus .bslot.on{opacity:1;}
  .brkdr.active{border-color:var(--txt)!important;background:var(--panel)!important;}
  .label{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700;}
  .ptitle{font-size:13px;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:7px;}
  .tabbtn{position:relative;padding:13px 4px;font-weight:700;font-size:13.5px;color:var(--mut);transition:color .2s;cursor:pointer;background:none;border:none;}
  .tabbtn.active{color:#fff;}
  .tabbtn.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;border-radius:2px;background:var(--cyan);}
  .chip{display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;letter-spacing:.03em;padding:3px 6px;border-radius:5px;color:#fff;min-width:38px;}
  .pill{font-size:9px;font-weight:800;letter-spacing:.04em;padding:3px 7px;border-radius:5px;}
  .rchip{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;border-radius:6px;font-weight:800;font-size:12px;}
  .r-hi{background:rgba(54,211,153,.16);color:#36d399;} .r-md{background:rgba(255,255,255,.08);color:#cbd3df;} .r-lo{background:rgba(255,93,108,.16);color:#ff5d6c;}
  details{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:13px;}
  summary{list-style:none;cursor:pointer;outline:none;} summary::-webkit-details-marker{display:none;}
  .chev{transition:transform .2s;} details[open] .chev{transform:rotate(90deg);}
  table{border-collapse:collapse;width:100%;} a{text-decoration:none;}
  .seclabel{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;color:#fff;padding:4px 9px;border-radius:5px;display:inline-block;margin:14px 0 8px;}
  .drafterbtn{padding:8px 15px;font-size:12.5px;font-weight:700;border-radius:20px;border:1px solid var(--border);background:var(--panel);color:var(--mut);cursor:pointer;transition:all .15s;}
  .drafterbtn.active{background:var(--cyan);color:#04121f;border-color:var(--cyan);}
  /* Keep the sticky header painted above the page on iOS Safari: give it its own compositing layer and
     a high z-index, and put all page content in one stacking context underneath it. Without this, the
     position:relative bullet lists (Summary stories, preview keys) drew on top of the header. */
  header.sticky{position:-webkit-sticky;position:sticky;z-index:50;background-color:#0b0f16;-webkit-transform:translateZ(0);transform:translateZ(0);}
  main,footer{position:relative;z-index:0;isolation:isolate;}
  #drafterSwitcher{-webkit-transform:translateZ(0);transform:translateZ(0);}
  /* Phones: keep the pinned area small. syncStickyTop() slides the title/stamp off-screen so only the
     tab bar stays pinned; the tabs scroll sideways in one row; drafter pills wrap, but smaller. */
  @media (max-width:640px){
    .tabnav{flex-wrap:nowrap !important;gap:20px !important;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
    .tabnav::-webkit-scrollbar{display:none;}
    /* all 6 tabs fit one row on a ~410px phone (Flip 7 main screen): tighter gaps, spread edge to edge.
       overflow-x:auto above stays as the fallback for narrower screens (cover screen). */
    .tabnav{gap:8px !important;justify-content:space-between;}
    .tabbtn{font-size:13px;}
    .tabbtn{flex:0 0 auto;white-space:nowrap;padding:11px 2px;}
    .tabbtn.active::after{bottom:0;}
    .tab-long{display:none;}
    #genStamp{text-align:left !important;width:100%;}
    #drafterSwitcher{gap:6px !important;padding:8px 0 9px !important;}
    .drafterbtn{white-space:nowrap;padding:6px 11px;font-size:12px;}
  }
  /* Pool Odds tab only */
  #poolStrip{position:-webkit-sticky;position:sticky;top:0;z-index:5;background:var(--bg);-webkit-transform:translateZ(0);transform:translateZ(0);}
  .poolbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex:1 1 0;min-width:0;min-height:44px;padding:6px 8px;font-size:12px;font-weight:700;line-height:1.25;text-align:center;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--txt);cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .poolbtn.sug{background:rgba(78,161,255,.10);border-color:rgba(78,161,255,.55);}
  .poolbtn.on{background:var(--cyan);border-color:var(--cyan);color:#04121f;}
  .poolbtn.lock{cursor:default;border-color:var(--green);color:var(--green);}
  .poolbtn.out{cursor:default;opacity:.45;text-decoration:line-through;}
  .poolbtn.poolchip{flex:0 0 auto;min-height:40px;padding:5px 9px;font-size:11.5px;}
  .poolsub{font-size:9px;font-weight:700;letter-spacing:.04em;opacity:.75;}
  .poolrow{display:flex;align-items:stretch;gap:7px;margin-top:7px;}
  .poolat{align-self:center;flex:0 0 auto;font-size:10px;color:var(--mut);font-weight:700;}
  .poolsel{min-height:40px;max-width:68%;padding:6px 8px;font-size:12px;font-weight:600;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--txt);}
  .poolsel.on{border-color:var(--cyan);color:var(--cyan);}
  @media (max-width:380px){
    .tabnav{gap:6px !important;}
    .tabbtn{font-size:12.5px;}
  }
</style>
</head>

  <footer class="max-w-5xl mx-auto px-5 pb-9"><p id="foot" style="font-size:11px;color:var(--mut);line-height:1.6"></p></footer>

  ['Toney out for the regular season','Miami WR Malachi Toney has a high-ankle sprain that needed surgery; he is expected to miss the rest of the regular season, and Miami hopes to have him back for the CFP.'],
  ['Heisman: Carr takes over','CJ Carr went from +1200 to +120 at BetMGM. Darian Mensah drifted to +350 and Jeremiah Smith to +400; Gunner Stockton and Devon Dampier are both +1500.'],
  ['Georgia is the new CFP No. 1','The committee&rsquo;s second ranking (Nov 10) has Georgia, Utah, Alabama and UCLA in the bye spots. Miami fell to No. 7 and Indiana to No. 9; Notre Dame jumped to No. 5. Seven drafted teams are in the field, with Tennessee replacing Ole Miss.'],
  ['Week 11 injury reports','Indiana&rsquo;s Josh Hoover is not on the Big Ten report for USC, but RB Turbo Richard is out. Ole Miss RB Kewan Lacy is expected to miss the rest of the season. Texas EDGE Colin Simmons is off the report for LSU, and LSU LB Whit Weeks is questionable.'],
  ['Week 11: four Pool Matchups','USC at Indiana, Michigan at Oregon, Texas at LSU and Tennessee at Texas A&amp;M, all Saturday Nov 14; Colorado hosts Houston tonight. The next CFP ranking comes out Tuesday Nov 17.']

/* ---- Pool Title Odds (added 2026-11-04) ------------------------------------------------
   Math (all from TITLE_ODDS.board, one sportsbook):
   1. American odds -> implied probability: +X -> 100/(X+100); -X -> X/(X+100).
   2. Remove the bookmaker margin: implied probabilities on a board add up to more than 100%
      (the overround). Divide each by the board total so they sum to 100% (proportional de-vig).
   3. Drafter chance = SUM of their teams' chances. Only one team can win the title, so the
      events are mutually exclusive and add directly (no 1-(1-p)(1-q) needed).
   4. "No pool winner" = 1 - sum over all 21 drafted teams = chance an undrafted team wins.
   Teams not on the board count as 0; they are all longer than the board's last price. */
function amImp(o){return o>=0?100/(o+100):(-o)/(-o+100);}
function titleOdds(){
 var imp={},S=0;
 TITLE_ODDS.board.forEach(function(r){var p=amImp(r[1]);imp[r[0]]=p;S+=p;});
 var fair={};for(var k in imp)fair[k]=imp[k]/S;
 var rows=DRAFT.drafters.map(function(d,i){
  var teams=d[1].map(function(t){return {team:t[0],p:fair[t[0]]||0,on:(t[0] in fair)};});
  var tot=0;teams.forEach(function(x){tot+=x.p;});
  teams.sort(function(a,b){return b.p-a.p;});
  return {name:d[0],idx:i,p:tot,teams:teams};
 });
 var drafted=0;rows.forEach(function(r){drafted+=r.p;});
 rows.sort(function(a,b){return b.p-a.p;});
 return {rows:rows,none:Math.max(0,1-drafted),overround:S};
}
function pct(p,dec){if(p<=0)return '&mdash;';var v=p*100;if(v<1&&!dec)return '&lt;1%';return (dec?v.toFixed(1):Math.round(v))+'%';}
function titleOddsPanel(){
 if(typeof TITLE_ODDS==='undefined'||!TITLE_ODDS.board||!TITLE_ODDS.board.length)return '';
 var o=titleOdds(),max=o.rows.length?Math.max(o.rows[0].p,o.none):1;
 var e=TITLE_ODDS.board[0],ex=e[0]+' '+(e[1]>=0?'+'+e[1]+' &rarr; 100 &divide; '+(e[1]+100):e[1]+' &rarr; '+(-e[1])+' &divide; '+(-e[1]+100))+' = '+Math.round(amImp(e[1])*100)+'%';
 function bar(p,c){return '<div style="height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:5px"><div style="height:100%;width:'+(max>0?(100*p/max).toFixed(1):0)+'%;background:'+c+';border-radius:4px"></div></div>';}
 var rows=o.rows.map(function(r,i){
  var c=DR_COLORS[r.idx%DR_COLORS.length];
  var tl=r.teams.map(function(x){return '<span style="white-space:nowrap">'+ab(x.team)+' <b style="color:'+(x.p>0?'var(--txt)':'var(--mut)')+'">'+(x.on?pct(x.p):'&mdash;')+'</b></span>';}).join(' &middot; ');

   '<div style="display:flex;align-items:baseline;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:'+c+';flex:0 0 auto;align-self:center"></span>'+

/* ---- CFP Field Tracker (replaces preseason All-Americans, added 2026-09-05) -----------------
   Computed entirely from data already refreshed weekly for the Summary tab (CFP, AP25,
   DRAFT.drafters) — no new research needed on refresh day. Buckets each of the 21 drafted
   teams into one of three tiers:
     field   - in CFP.byes or CFP.first (the current 12-team projected field)
     bubble  - not in the field, but ranked in AP25
     outside - not in the field, not ranked
   Byes are NOT assigned a synthetic 1-4 seed number — CFP.byes doesn't rank them, so we
   don't invent an order the source data doesn't support. */
function cfpFieldTiers(){
 var byeNote={};CFP.byes.forEach(function(b){byeNote[b[0]]=b[1];});
 var firstInfo={};
 CFP.first.forEach(function(g){
  firstInfo[g[1]]={seed:g[0],opp:g[4],oppSeed:g[3],home:true};
  firstInfo[g[4]]={seed:g[3],opp:g[1],oppSeed:g[0],home:false};
 });
 var rankOf={};
 AP25.forEach(function(r){if(!(r[1] in rankOf))rankOf[r[1]]=r[0];});
 var field=[],bubble=[],outside=[];
 DRAFT.drafters.forEach(function(d){
  d[1].forEach(function(t){
   var team=t[0];
   if(!team||team==='TBD')return;
   if(byeNote[team]!==undefined){
    field.push({team:team,drafter:d[0],bye:true,note:byeNote[team]});
   }else if(firstInfo[team]){
    var fi=firstInfo[team];
    field.push({team:team,drafter:d[0],bye:false,seed:fi.seed,opp:fi.opp,oppSeed:fi.oppSeed,home:fi.home});
   }else if(rankOf[team]!==undefined){
    bubble.push({team:team,drafter:d[0],rank:rankOf[team]});
   }else{
    outside.push({team:team,drafter:d[0]});
   }
  });
 });
 field.sort(function(a,b){
  if(a.bye&&!b.bye)return -1;
  if(!a.bye&&b.bye)return 1;
  if(a.bye&&b.bye)return 0;
  return a.seed-b.seed;
 });
 bubble.sort(function(a,b){return a.rank-b.rank;});
 return {field:field,bubble:bubble,outside:outside};
}

var DR_COLORS=['#4ea1ff','#ff5d6c','#f5c451','#36d399','#a78bfa','#ff9d52','#2dd4bf'];

function brkSlot(x,y,w,seed,team){

  '<rect x="'+(x+17)+'" y="'+(y+4)+'" width="30" height="14" rx="3" fill="'+c.b+'"/>'+

/* one half: pods (top seed P vs winner of R1 game G1), (top seed Q vs winner of G2) */
function brkHalf(S,p,g1,q,g2,label){
 var W=112,X1=0,X2=124,X3=248,T=30;
 function tm(n){return S[n]||null;}

  '<text x="'+(X3+2)+'" y="22" font-size="8" fill="#8a94a4">'+label+'</text>';
 // R1 games (higher seed on top = host)
 o+=brkGame(X1,T+8,W,[g1[0],tm(g1[0])],[g1[1],tm(g1[1])]);
 o+=brkGame(X1,T+108,W,[g2[0],tm(g2[0])],[g2[1],tm(g2[1])]);
 // QFs: bye seed on top, R1 winner below
 o+=brkGame(X2,T+20,W,[p,tm(p)],['W '+g1[0]+'/'+g1[1],null]);
 o+=brkGame(X2,T+120,W,[q,tm(q)],['W '+g2[0]+'/'+g2[1],null]);
 // SF
 o+=brkGame(X3,T+70,W,['Winner QF '+p,null],['Winner QF '+q,null]);
 o+=brkElbow(X1+W,T+31,X2,T+55)+brkElbow(X1+W,T+131,X2,T+155)+brkElbow(X2+W,T+43,X3,T+81)+brkElbow(X2+W,T+143,X3,T+105);
 return '<svg viewBox="0 0 360 '+(T+162)+'" width="100%" style="display:block;max-width:560px;font-family:Inter,system-ui,sans-serif" role="img" aria-label="CFP bracket half">'+o+'</svg>';

/* ===== POOL MATCHUP DETECTION + STAT-STRIP COUNTS (added 2026-09-05) ===== */
/* team name -> drafter label, built once from DRAFT.drafters. Exact-key lookup,
   so "Georgia" and "Georgia Tech" never cross-match. */
var TEAM2DRAFTER={};
DRAFT.drafters.forEach(function(d){d[1].forEach(function(t){if(t[0]&&t[0]!=='TBD')TEAM2DRAFTER[t[0]]=d[0];});});

/* This week's cross-drafter pool matchups: scan PREVIEWS and OTHER for games
   where BOTH teams are drafted AND by DIFFERENT drafters (same-drafter pairs like
   Ohio State vs Penn State are excluded). This is a forward-looking teaser, so
   RECAPS is deliberately NOT scanned - RECAPS entries are completed games by
   definition (they carry final scores in sa/sb), with no reliable "is this done
   yet" signal, so they are excluded structurally rather than by a filter.
   PREVIEWS is inherently upcoming and needs no filter. Only OTHER can carry a
   just-played compact line, so the FINAL check below is specifically for OTHER
   (its time field legitimately reads e.g. "FINAL (Aug 29, Week 0)"). A matchup
   found in both PREVIEWS and OTHER is counted once. [] = none. */
function poolMatchups(){
 var seen={},out=[];
 function consider(a,b,meta){
  if(!a||!b)return;
  var da=TEAM2DRAFTER[a],db=TEAM2DRAFTER[b];
  if(!da||!db||da===db)return;
  meta=meta||'';
  if(/\bFINAL\b/i.test(meta))return; // excludes completed OTHER compact lines
  var key=[a,b].sort().join(' | ');
  if(seen[key])return;
  seen[key]=1;
  out.push({a:a,b:b,drafterA:da,drafterB:db,meta:meta.replace(/^\s*Week\s*\d+\s*\|\s*/i,'').trim()});
 }
 PREVIEWS.forEach(function(p){consider(p.a,p.b,p.meta);});
 OTHER.forEach(function(g){consider(g[0],g[1],g[2]);});
 return out;
}
var POOL_MATCHUPS=poolMatchups();

/* how many drafted teams appear in a list of team names */
function draftedCount(names){var n=0;for(var t in TEAM2DRAFTER){if(names.indexOf(t)!==-1)n++;}return n;}
var RANKED_CT=draftedCount(AP25.map(function(r){return r[1];}));
var CFP_CT=draftedCount(
 CFP.byes.map(function(b){return b[0];})
  .concat(CFP.first.map(function(g){return g[1];}))
  .concat(CFP.first.map(function(g){return g[4];}))
);

/* fill the three live-count tiles behind the kickoff tile */
STAT=[
 STAT[0]||['','','var(--cyan)'],
 [''+RANKED_CT,'teams ranked','var(--gold)'],
 [''+POOL_MATCHUPS.length,'pool matchups','var(--green)'],
 [''+CFP_CT,'in the CFP field','var(--purple)']
];

  '<div style="font-size:11px;color:var(--gold);font-weight:700;margin-top:2px">Pool Matchup &middot; '+g.drafterA+' vs '+g.drafterB+'</div>'+
  (g.meta?'<div style="font-size:10px;color:var(--mut);margin-top:2px">'+g.meta+'</div>':'')+

function poolTeaserBlock(){

/* ===================== POOL ODDS MODEL =====================
   Simulates the rest of the season many times and counts how often each team wins the
   national title. Owner chance = sum of their 3 teams. "No winner" = an undrafted team wins.
   Data in:  POOL_RATINGS, POOL_TEAMS, POOL_GAMES, AP25, DRAFT (weekly data block) and
             CFP_BRACKET (official records block).
   Nothing in this section draws to the page. tools/pool_odds_test.js tests it.
   Full plain-language description: MAINTENANCE.md. */

/* ---------- SETTINGS: every modeling choice lives here ---------- */
var POOL_SETTINGS={
 SEED:20261206,          // Fixed random seed. Same seed + same data = same odds on every load.
 SIMS:10000,             // How many times the rest of the season is simulated for the OFFICIAL odds.
 WHATIF_SIMS:2500,       // Runs used for what-if picks only, so a tap answers quickly. Smaller =
                         // faster but noisier (about 1 point). Official odds never use this.

 /* -- how a single game is decided -- */
 HOME_FIELD:2.5,         // Points added to the home team. Not used at neutral sites.
 GAME_SD:16,             // Spread of real margins around the expected margin, in points.

                         // with this spread (points), because ratings are estimates, not facts.

 /* -- how the 12-team field is picked before Selection Day ("committee score") --

/* Conference groups under the 2026 CFP rules (collegefootballplayoff.com FAQ): the four POOL_POWER4

/* poolBuild(): turns the data into a model object M. Call with no argument to use the page's

 var ranking=d.ranking||AP25,draft=d.draft||DRAFT;

 var k,i;

 var n=M.n=M.names.length;

 var rating=new Float64Array(NT),confOf=new Int8Array(NT);   // confOf: 0-3 = POOL_POWER4 index, 4 = Group of 6, 5 = other FBS, -1 = not FBS
 var l0=new Int16Array(NT),cw0=new Int16Array(NT),cl0=new Int16Array(NT),ccl0=new Int16Array(NT); // losses, conf wins, conf losses, title-game losses so far

 /* --- owners --- */
 var owner=new Int8Array(NT);for(i=0;i<NT;i++)owner[i]=-1;

 /* --- games --- */

 M.gameById={};   // unplayed game id -> position in M.games

 var h2h={};      // "lo*NT+hi" -> winner index, completed conference games (for tiebreaks)

  if(res===0){
   M.gameById[id]=M.games.length;
   if(kind===1)pairGame[pairKey(h,a)]=M.games.length;
   if(kind===2&&confOf[h]>=0&&confOf[h]<4)ccGame[confOf[h]]=M.games.length;

 var sortedF=Array.prototype.slice.call(formula).sort(function(x,y){return y-x;});
 var rankOf={};
 (ranking||[]).forEach(function(r){if(!(r[1] in teamsIn))M.problems.push('Ranked team "'+r[1]+'" is not in POOL_TEAMS');else rankOf[M.idx[r[1]]]=r[0];});

 /* --- bracket layout --- */
 var NS=POOL_SLOTS.length;

  var res={sims:N,mode:useBracket?'bracket':'projection',picked:0,ownerCounts:[],noneCount:own[7],none:own[7]/N,

  for(s=0;s<NS;s++){var swin={};for(i=0;i<NT;i++)if(slotWinCt[s*NT+i])swin[M.names[i]]=slotWinCt[s*NT+i]/N;res.slotWin[POOL_SLOTS[s][0]]=swin;}
  for(i=0;i<NT;i++){
   if(title[i]){res.titleCounts[M.names[i]]=title[i];res.title[M.names[i]]=title[i]/N;}
   if(fieldCt[i])res.field[M.names[i]]=fieldCt[i]/N;
   if(champCt[i])res.confChamp[M.names[i]]=champCt[i]/N;
  }
  M.ownerNames.forEach(function(nm2,o){
   res.ownerCounts.push(own[o]);
   res.owners.push({name:nm2,idx:o,p:own[o]/N,teams:M.ownerTeams[o].map(function(t){return {team:t,p:(res.title[t]||0),field:(res.field[t]||0)};})});
  });
  /* per game: each owner's chance if side A wins vs if side B wins (A = home team, or bracket side A) */
  for(j=0;j<T;j++){
   var nA=0,nB=0,o2;
   for(o2=0;o2<8;o2++){nA+=cnt[j*16+o2];nB+=cnt[j*16+8+o2];}
   /* swing = chance if A wins minus chance if B wins. impact = how much the game is expected to move
      the most-affected owner, 2 x pA x pB x |swing|; it is small for near-certain games. Rank by impact. */
   var e={pA:nA/N,ifA:null,ifB:null,swing:null,maxSwing:0,impact:0};
   if(useBracket){var sk=M.slotKnown[tracked[j]],sl=POOL_SLOTS[tracked[j]];e.id=sl[0];e.slot=true;e.label=sl[1];e.a=M.names[sk[0]];e.b=M.names[sk[1]];e.neutral=tracked[j]<4?0:1;e.date='';}
   else{var gg=M.games[j];e.id=gg.id;e.slot=false;e.label=gg.kind===2?'Conference championship':'';e.a=M.names[gg.h];e.b=M.names[gg.a];e.neutral=gg.neutral;e.date=gg.date;}
   if(nA>0&&nB>0){   // a forced game has only one side, so it has no swing
    e.ifA=[];e.ifB=[];e.swing=[];
    for(o2=0;o2<8;o2++){var fa=cnt[j*16+o2]/nA,fb=cnt[j*16+8+o2]/nB;e.ifA.push(fa);e.ifB.push(fb);e.swing.push(fa-fb);if(o2<7&&Math.abs(fa-fb)>e.maxSwing)e.maxSwing=Math.abs(fa-fb);}
    e.impact=2*e.pA*(1-e.pA)*e.maxSwing;
   }
   res.games.push(e);
  }
  res.ms=Date.now()-t0;
  return res;
 };
 return M;
}

/* ---------- PICKS (what-if). Pure functions: they return a NEW picks object and never touch
   the data, the official odds or anything saved. A completed game is locked and cannot be picked. ---------- */

/* Pick (or un-pick, by picking the same team again) the winner of an unplayed regular-season or
   conference-title game. id = a game id from POOL_GAMES, or 'CC:<conference>' while that title game's
   teams are not known yet. Returns {ok, picks, note}. */
function poolPickGame(M,picks,id,team){
 var out=poolCopy(picks||{});
 if(id in M.locked)return {ok:false,picks:out,note:'That game is final. Its result is locked.'};
 if(id.indexOf('CC:')===0){
  var conf=id.slice(3);
  if(!(conf in M.ccOpen))return {ok:false,picks:out,note:'That conference title game cannot be picked this way.'};
  if(M.confTeams[M.ccOpen[conf]].indexOf(M.idx[team])<0)return {ok:false,picks:out,note:team+' is not in the '+conf+'.'};
 }else{
  var gi=M.gameById[id];
  if(gi===undefined)return {ok:false,picks:out,note:'Unknown game.'};
  var gm=M.games[gi];
  if(team!==M.names[gm.h]&&team!==M.names[gm.a])return {ok:false,picks:out,note:team+' is not playing in that game.'};
 }
 if(out[id]===team)delete out[id];else out[id]=team;
 return {ok:true,picks:out,note:''};
}

/* Remove bracket picks that no longer make sense. A pick "team X wins slot S" is valid only if S is
   unplayed, S is on X's path, and every earlier game on X's path is won by X (really, or by a pick).
   Slots are checked in round order, so removing one pick also removes later picks that needed it.
   Returns {picks, removed:[{slot,team}]}. */
function poolBracketConsistent(M,picks){
 var out=poolCopy(picks||{}),removed=[];
 POOL_SLOTS.forEach(function(sl,s){
  var team=out[sl[0]];if(team===undefined)return;
  var path=M.pathOf[team],ok=!!path&&path.indexOf(s)>=0&&M.lockW[s]<0;
  if(ok){
   for(var j=0;j<path.length&&path[j]!==s;j++){
    var e=path[j];
    if(M.lockW[e]>=0){if(M.names[M.lockW[e]]!==team)ok=false;}
    else if(out[POOL_SLOTS[e][0]]!==team)ok=false;
   }
  }
  if(!ok){delete out[sl[0]];removed.push({slot:sl[0],team:team});}
 });
 return {picks:out,removed:removed};
}

/* Bracket pick (after Selection Day): "team wins slot slotId". Also marks the team as winner of
   every earlier unplayed game on its path, and clears any other picks this knocks out. Picking the
   same team in the same slot again un-picks it. Returns {ok, picks, note}. */
function poolPickBracket(M,picks,slotId,team){
 var out=poolCopy(picks||{});
 if(!M.bracket)return {ok:false,picks:out,note:'The bracket is not set yet.'};
 var s=M.slotIndex[slotId];
 if(s===undefined)return {ok:false,picks:out,note:'Unknown bracket game.'};
 if(M.lockW[s]>=0)return {ok:false,picks:out,note:'That game is final. Its result is locked.'};
 var path=M.pathOf[team];
 if(!path||path.indexOf(s)<0)return {ok:false,picks:out,note:team+' cannot reach that game.'};
 var j;
 for(j=0;j<path.length&&path[j]!==s;j++){
  if(M.lockW[path[j]]>=0&&M.names[M.lockW[path[j]]]!==team)return {ok:false,picks:out,note:team+' has been eliminated.'};
 }
 if(out[slotId]===team)delete out[slotId];
 else{for(j=0;j<path.length;j++){if(M.lockW[path[j]]<0)out[POOL_SLOTS[path[j]][0]]=team;if(path[j]===s)break;}}
 return {ok:true,picks:poolBracketConsistent(M,out).picks,note:''};
}

/* Check picks against the current official results. A pick on a game that has since finished is
   dropped; if it disagreed with the real result, a note says so, and any later bracket picks that
   depended on it are dropped too. Returns {picks, notes:[text]}. */
function poolReconcilePicks(M,picks){
 var out={},notes=[],k;
 for(k in picks){
  var isSlot=(k in M.slotIndex);
  if(k in M.locked){
   if(M.locked[k]!==picks[k])notes.push((isSlot?POOL_SLOTS[M.slotIndex[k]][1]:'Game')+' is final: '+M.locked[k]+' won. Your pick of '+picks[k]+' was cleared.');
   continue;
  }
  if(isSlot){if(M.bracket)out[k]=picks[k];continue;}
  if(k.indexOf('CC:')===0){if(k.slice(3) in M.ccOpen)out[k]=picks[k];continue;}
  if(k in M.gameById)out[k]=picks[k];
 }
 var fixed=poolBracketConsistent(M,out);
 fixed.removed.forEach(function(x){notes.push('Your pick of '+x.team+' in the '+POOL_SLOTS[M.slotIndex[x.slot]][1].toLowerCase()+' was cleared because it depended on a result that did not happen.');});
 return {picks:fixed.picks,notes:notes};
}

/* ===================== POOL ODDS TAB (drawing + taps) =====================
   Everything the Pool Odds tab shows is built here from a "ui" object:
     ui.M        the model (poolBuild)
     ui.official official odds = M.run({}) with NO picks. Never changed by taps.
     ui.current  what is on screen: the same object as ui.official when there are no picks,
                 otherwise M.run(ui.picks)
     ui.picks    the viewer's what-if picks. Kept in memory only: never saved, gone on reload.
     ui.notes    short messages to show (e.g. why a pick was cleared)
   The elimination tracker and the group-text card always read ui.official. */
var POOL_UI={M:null,official:null,current:null,picks:{},notes:[],showAll:false,pHome:{},impact:{}};
var POOL_LOCK_ICON='<svg width="10" height="10" viewBox="0 0 24 24" style="display:inline-block;vertical-align:-1px"><path d="M7 10V7a5 5 0 0110 0v3" fill="none" stroke="currentColor" stroke-width="2.6"/><rect x="4" y="10" width="16" height="11" rx="2.5" fill="currentColor"/></svg>';

function poolPct(p){if(p<=0)return '0%';if(p>=1)return '100%';var v=p*100;return (v<0.1?v.toFixed(2):v.toFixed(1))+'%';}
/* "ACTUALLY OUT" - decided from real results (and, in what-if mode, the picks), NEVER from how many
   simulation runs a team won. Before Selection Day nobody is out. After it a team is out if it is not
   in the bracket, lost a completed CFP game, or a what-if pick has another team winning a game on its path. */
function poolTeamOut(M,picks,team){
 if(!M.bracket)return false;
 var path=M.pathOf[team];if(!path)return true;
 for(var j=0;j<path.length;j++){
  var s=path[j],w=M.lockW[s]>=0?M.names[M.lockW[s]]:(picks?picks[POOL_SLOTS[s][0]]:undefined);
  if(w!==undefined&&w!==team)return true;
 }
 return false;
}
function poolOwnerOut(M,picks,oi){return M.ownerTeams[oi].every(function(t){return poolTeamOut(M,picks,t);});}
/* "No winner" is impossible only when every team still alive in the bracket is a drafted team */
function poolNoneOut(M,picks){return !!M.bracket&&M.bracket.seeds.every(function(t){return drIdx(t)>=0||poolTeamOut(M,picks,t);});}
/* A chance as text. Zero runs is shown as "under 0.01%" (less than 1 run in n), not 0%, unless the
   team/owner is actually out. short = use "<" instead of the word "under" where space is tight. */
function poolShow(p,out,n,short){if(p>0)return poolPct(p);if(out)return '0%';return (short?'&lt;':'under ')+(100/n)+'%';}
function poolPickCount(picks){var n=0;for(var k in picks)n++;return n;}
function poolDay(d){   // '2026-11-14' -> 'Sat, Nov 14'
 var p=d.split('-');if(p.length!==3)return d;
 return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function poolAddDays(d,n){var p=d.split('-');var t=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+n));return t.toISOString().slice(0,10);}
function poolDot(c){return '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+c+';flex:0 0 auto"></span>';}
/* team name with its owner's color dot in front (no dot = undrafted). shown = optional shorter display name */
function poolTeamLabel(team,shown){var di=drIdx(team);return (di>=0?poolDot(DR_COLORS[di%DR_COLORS.length])+' ':'')+(shown||team);}
/* owner status: Eliminated only when all three teams are actually out (see poolTeamOut);
   otherwise Long shot below POOL_SETTINGS.LONG_SHOT (this includes zero runs); otherwise Alive */
function poolStatus(p,out){return out?['Eliminated','var(--red)']:(p<POOL_SETTINGS.LONG_SHOT?['Long shot','var(--orange)']:['Alive','var(--green)']);}

/* sticky bar, shown only while picks are active */

/* feature 1: the odds. Big number = what is on screen (what-if if picks are active); official shown beside it. */
function poolOddsHtml(ui){

   bar(r.p,c)+'<div style="font-size:10px;color:var(--mut);margin-top:4px">'+tl+'</div></div>';
 }).join('');
 rows+='<div style="padding:8px 0;border-top:1px solid var(--line)"><div style="display:flex;align-items:baseline;gap:8px"><span style="align-self:center;display:flex">'+poolDot('var(--mut)')+'</span>'+

 return '<div class="panel" style="padding:13px 15px;margin-bottom:12px;'+(whatIf?'border-color:var(--gold)':'')+'">'+

/* feature 2: games that matter. Next slate (7 days from the next game) before Selection Day; every
   CFP game with both teams known after it. Ranked by impact, top 10. */
function poolMatterHtml(ui){
 var cur=ui.current,games=cur.games.filter(function(g){return g.swing&&g.impact>0;}),through='';
 if(cur.mode!=='bracket'&&games.length){
  var first=games.reduce(function(m,g){return g.date<m?g.date:m;},games[0].date);

 }
 games.sort(function(a,b){return b.impact-a.impact;});
 games=games.slice(0,10);
 var body=games.map(function(g,i){

   '<div style="display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px">'+(rl||'<span style="font-size:10.5px;color:var(--mut)">No owner moves by half a point.</span>')+'</div></div>';
 }).join('');
 return '<div class="panel" style="padding:13px 15px;margin-bottom:12px"><div class="ptitle" style="color:var(--cyan)">Games That Matter <span style="font-size:10px;color:var(--mut);font-weight:600">who to root for'+(through?' &middot; through '+poolDay(through):'')+'</span></div>'+

}

/* feature 3 before Selection Day: tap the winner of unplayed games */
/* FAVORITES ARE SUGGESTIONS, NOT PICKS. The favorite is the team with the higher OFFICIAL win chance
   (the home team on an exact 50/50). It only changes how a button looks; it is never put in ui.picks,
   so it cannot change official odds, what-if odds, Reset or snapshots.
   poolGameLook = how one team's button looks in a regular-season game: picked, suggested, or plain. */
function poolGameFavorite(ui,g){return ui.pHome[g.id]>=0.5?g.h:g.a;}
function poolGameLook(ui,g,ti){
 var pk=ui.picks[g.id],ph=ui.pHome[g.id],p=ti===g.h?ph:1-ph;
 if(pk===ui.M.names[ti])return {on:true,sug:false,sub:'YOUR PICK'};
 var sug=pk===undefined&&ti===poolGameFavorite(ui,g);
 return {on:false,sug:sug,sub:Math.round(p*100)+'%'+(sug?' &middot; favorite':'')};
}
function poolGameRow(ui,g){
 var M=ui.M;
 function btn(ti){var lk=poolGameLook(ui,g,ti);
  return '<button class="poolbtn'+(lk.on?' on':'')+(lk.sug?' sug':'')+'" data-act="game" data-id="'+g.id+'" data-t="'+ti+'"><span>'+poolTeamLabel(M.names[ti])+'</span><span class="poolsub">'+lk.sub+'</span></button>';}
 return '<div class="poolrow">'+btn(g.a)+'<span class="poolat">'+(g.neutral?'vs':'at')+'</span>'+btn(g.h)+'</div>';
}
/* "Favorites win the regular season": returns picks with the favorite filled in for every unplayed game
   and every conference title that has NO pick yet. Picks the viewer already made are kept, never
   overwritten. These are ordinary what-if picks (Reset clears them). The playoff is left alone, so it
   stays simulated. Does nothing in bracket mode (the regular season is over). */
function poolFavoritePicks(ui){
 var M=ui.M,out=poolCopy(ui.picks);
 if(M.bracket)return out;
 M.games.forEach(function(g){if(!(g.id in out))out[g.id]=M.names[poolGameFavorite(ui,g)];});
 /* title games whose teams are not known yet: with every game above decided, one what-if run shows who
    is most likely to win each title; that team is the favorite of that title game */
 var open=POOL_POWER4.filter(function(c){return (c in M.ccOpen)&&!(('CC:'+c) in out);});
 if(open.length){
  var r=M.run(out,M.settings.WHATIF_SIMS);
  open.forEach(function(c){var best=null,bp=-1;
   M.confTeams[M.ccOpen[c]].forEach(function(ti){var p=r.confChamp[M.names[ti]]||0;if(p>bp){bp=p;best=M.names[ti];}});
   if(best)out['CC:'+c]=best;});
 }
 return out;
}
function poolDayCount(n,npk){return n+' game'+(n===1?'':'s')+(npk?' &middot; '+npk+' picked':'');}
/* After a tap on one game: update just that game's two buttons and its day's count, instead of
   rebuilding the whole game list (keeps taps quick, and keeps the list from jumping). */
function poolTouchGame(ui,id){
 var M=ui.M,g=M.games[M.gameById[id]];
 document.querySelectorAll('#poolPicker button[data-act="game"][data-id="'+id+'"]').forEach(function(b){
  var lk=poolGameLook(ui,g,+b.getAttribute('data-t')),sub=b.querySelector('.poolsub');
  b.classList.toggle('on',lk.on);b.classList.toggle('sug',lk.sug);
  if(sub)sub.innerHTML=lk.sub;
 });
 var cnt=document.querySelector('#poolPicker [data-cnt="'+g.date+'"]');
 if(cnt){
  var npk=M.games.filter(function(x){return x.date===g.date&&(x.id in ui.picks);}).length;
  cnt.innerHTML=poolDayCount(+cnt.getAttribute('data-n'),npk);cnt.style.color=npk?'var(--gold)':'var(--mut)';
 }
}
function poolGamePickerHtml(ui){
 var M=ui.M,off=ui.official;
 /* conference title games whose teams are not known yet: choose the champion from a list */
 var cc=POOL_POWER4.filter(function(c){return c in M.ccOpen;}).map(function(c){
  var id='CC:'+c,pk=ui.picks[id];
  var teams=M.confTeams[M.ccOpen[c]].map(function(ti){return {ti:ti,name:M.names[ti],p:off.confChamp[M.names[ti]]||0};})
   .filter(function(t){return t.p>0||t.name===pk;}).sort(function(a,b){return b.p-a.p;});
  return '<label style="display:flex;align-items:center;gap:8px;padding:5px 0"><span style="font-size:12px;font-weight:700;flex:1">'+c+' champion</span>'+
   '<select class="poolsel'+(pk?' on':'')+'" data-act="cc" data-id="'+id+'"><option value="">'+(teams.length?'Simulate (fav: '+teams[0].name+' '+Math.round(teams[0].p*100)+'%)':'Simulate (no pick)')+'</option>'+
   teams.map(function(t){return '<option value="'+t.ti+'"'+(t.name===pk?' selected':'')+'>'+t.name+' ('+Math.round(t.p*100)+'%)</option>';}).join('')+'</select></label>';
 }).join('');
 /* unplayed games by date. Default list = the next 7 days of games that involve a drafted team or move
    the odds (plus anything already picked). "Show all" lists every unplayed game. */
 var byDate={},dates=[],shown=0;
 var firstDate=M.games.reduce(function(m,g){return (!m||g.date<m)?g.date:m;},''),through=firstDate?poolAddDays(firstDate,6):'';
 M.games.forEach(function(g){
  var keep=ui.showAll||(g.id in ui.picks)||(g.date<=through&&(drIdx(M.names[g.h])>=0||drIdx(M.names[g.a])>=0||(ui.impact[g.id]||0)>=0.002));
  if(!keep)return;shown++;
  if(!byDate[g.date]){byDate[g.date]=[];dates.push(g.date);}
  byDate[g.date].push(g);
 });
 dates.sort();
 var days=dates.map(function(d,i){
  var npk=byDate[d].filter(function(g){return g.id in ui.picks;}).length;
  return '<details data-k="d'+d+'"'+(i===0?' open':'')+' style="margin-bottom:8px"><summary style="padding:11px 13px;display:flex;align-items:center;gap:8px">'+chev()+
   '<span style="font-size:12.5px;font-weight:800;flex:1">'+poolDay(d)+'</span><span data-cnt="'+d+'" data-n="'+byDate[d].length+'" style="font-size:10.5px;color:'+(npk?'var(--gold)':'var(--mut)')+'">'+poolDayCount(byDate[d].length,npk)+'</span></summary>'+
   '<div style="padding:0 11px 9px">'+byDate[d].map(function(g){return poolGameRow(ui,g);}).join('')+'</div></details>';
 }).join('');
 /* completed games: locked, shown for the last 10 days, not tappable */
 var lastDone=M.done.reduce(function(m,g){return g.date>m?g.date:m;},''),since=lastDone?poolAddDays(lastDone,-9):'';
 var recent=M.done.filter(function(g){return g.date>=since;}).sort(function(a,b){return a.date<b.date?1:-1;});
 var locked=recent.length?'<details data-k="locked" style="margin-bottom:8px"><summary style="padding:11px 13px;display:flex;align-items:center;gap:8px">'+chev()+
  '<span style="font-size:12.5px;font-weight:800;flex:1">Final results</span><span style="font-size:10.5px;color:var(--mut)">'+POOL_LOCK_ICON+' locked &middot; '+recent.length+' recent</span></summary><div style="padding:0 11px 9px">'+
  recent.map(function(g){var w=M.names[g.winner],l=M.names[g.winner===g.h?g.a:g.h];
   return '<div class="poolrow"><span class="poolbtn lock"><span>'+POOL_LOCK_ICON+' '+poolTeamLabel(w)+'</span><span class="poolsub">WON &middot; '+poolDay(g.date)+'</span></span><span class="poolat">def.</span><span class="poolbtn out"><span>'+l+'</span></span></div>';}).join('')+
  '</div></details>':'';
 return '<div class="panel" style="padding:13px 15px;margin-bottom:12px"><div class="ptitle" style="color:var(--gold)">What-If Picker <span style="font-size:10px;color:var(--mut);font-weight:600">tap a winner; tap again to undo</span></div>'+
  '<div style="font-size:10.5px;color:var(--mut);margin:5px 0 8px;line-height:1.5">Picked games are forced; everything else is still simulated. Picks only change your screen and vanish on reload. Percentages on the buttons are official win chances. The lighter button is the favorite: a suggestion, not a pick.</div>'+
  '<button class="poolbtn" data-act="favs" style="width:100%">Favorites win the regular season</button>'+
  '<div style="font-size:10px;color:var(--mut);margin:5px 0 10px;line-height:1.45">Picks the favorite in every game you have not picked, including the conference title games. Your own picks are kept. The playoff stays simulated.</div>'+
  (cc?'<div style="border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 0;margin-bottom:10px">'+cc+'</div>':'')+
  days+locked+
  '<button class="poolbtn" data-act="all" style="width:100%">'+(ui.showAll?'Show only the next 7 days':'Show all '+M.games.length+' unplayed games (showing '+shown+(through?', through '+poolDay(through):'')+')')+'</button></div>';
}

/* feature 3 after Selection Day: the bracket. Each game lists every team that can still reach it;
   tap one to advance it to that point. Completed games show the winner with a lock and cannot be tapped. */
function poolBracketHtml(ui){
 var M=ui.M,seeds=M.bracket.seeds,seedOf={};
 seeds.forEach(function(t,i){seedOf[t]=i+1;});
 function cands(side){   // teams that can still fill this side of a game
  if(typeof side==='number')return [seeds[side-1]];
  var s=M.slotIndex[side];
  if(M.lockW[s]>=0)return [M.names[M.lockW[s]]];
  return cands(POOL_SLOTS[s][2]).concat(cands(POOL_SLOTS[s][3]));
 }
 var html='',lastRound='';
 POOL_SLOTS.forEach(function(sl,s){
  var isLocked=M.lockW[s]>=0,winner=isLocked?M.names[M.lockW[s]]:null,pk=ui.picks[sl[0]];
  /* favorite = the team most likely to win THIS game, among teams that can still reach it, using the odds
     on screen. A suggestion only: it is not a pick. None for a finished or already-picked game. */
  var fav=null,favP=0,sw=(ui.current.slotWin||{})[sl[0]]||{};
  if(!isLocked&&pk===undefined)cands(sl[2]).concat(cands(sl[3])).forEach(function(tm){var p=sw[tm]||0;if(p>favP){favP=p;fav=tm;}});
  function chip(team){
   var inner='<span>'+(isLocked&&team===winner?POOL_LOCK_ICON+' ':'')+'<span style="color:'+(pk===team?'inherit':(seedOf[team]<=4?'var(--gold)':'var(--mut)'))+';font-weight:900">'+seedOf[team]+'</span> '+poolTeamLabel(team,brkName(team))+'</span>';
   if(isLocked)return '<span class="poolbtn poolchip '+(team===winner?'lock':'out')+'">'+inner+'</span>';
   return '<button class="poolbtn poolchip'+(pk===team?' on':'')+(team===fav?' sug':'')+'" data-act="slot" data-id="'+sl[0]+'" data-t="'+M.idx[team]+'">'+inner+(team===fav?'<span class="poolsub">'+Math.round(favP*100)+'% &middot; favorite</span>':'')+'</button>';
  }
  function side(x){return '<div style="display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0">'+cands(x).map(chip).join('')+'</div>';}
  if(sl[1]!==lastRound){lastRound=sl[1];html+='<div class="label" style="margin:12px 0 6px">'+sl[1]+(sl[1]==='First round'?' &middot; at the better seed':'')+'</div>';}
  html+='<div style="background:var(--panel2);border:1px solid '+(!isLocked&&pk?'var(--cyan)':'var(--border)')+';border-radius:10px;padding:8px;margin-bottom:7px">'+
   (isLocked?'<div style="font-size:9.5px;color:var(--green);font-weight:800;margin-bottom:5px">'+POOL_LOCK_ICON+' FINAL &middot; '+winner+' won</div>':(pk?'<div style="font-size:9.5px;color:var(--cyan);font-weight:800;margin-bottom:5px">YOUR PICK: '+pk+'</div>':''))+
   '<div style="display:flex;align-items:center;gap:7px">'+side(sl[2])+'<span class="poolat">vs</span>'+side(sl[3])+'</div></div>';
 });
 return '<div class="panel" style="padding:13px 15px;margin-bottom:12px"><div class="ptitle" style="color:var(--gold);flex-wrap:wrap">CFP Bracket &middot; What-If Picker <span style="font-size:10px;color:var(--mut);font-weight:600">tap a team to advance it; tap again to undo</span></div>'+
  '<div style="font-size:10.5px;color:var(--mut);margin:5px 0 2px;line-height:1.5">Tap a team in any round to send it that far; its earlier games are picked for you. Finished games are locked to the real result. Picks only change your screen and vanish on reload. The lighter team in each game is the favorite to win it: a suggestion, not a pick.</div>'+html+'</div>';
}
function poolPickerHtml(ui){return ui.M.bracket?poolBracketHtml(ui):poolGamePickerHtml(ui);}

/* feature 6: group-text card. ALWAYS official odds, never what-if. Narrow on purpose for screenshots. */
function poolCardHtml(ui){
 var off=ui.official,rows=off.owners.slice().sort(function(a,b){return b.p-a.p||a.idx-b.idx;});
 var max=Math.max(rows[0].p,off.none,0.0001);
 function line(name,p,c,dim,out){return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0">'+poolDot(c)+
  '<span style="font-size:13px;font-weight:700;width:128px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'+(dim?'color:var(--mut)':'')+'">'+name+'</span>'+
  '<span style="flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden"><span style="display:block;height:100%;width:'+(100*p/max).toFixed(1)+'%;background:'+c+';border-radius:4px"></span></span>'+
  '<span style="font-size:14px;font-weight:900;min-width:52px;text-align:right;white-space:nowrap;color:'+c+'">'+poolShow(p,out,off.sims)+'</span></div>';}
 return '<div class="label" style="margin:4px 0 6px">Group-text card &middot; screenshot this &middot; always official odds</div>'+
  '<div id="poolShot" style="max-width:360px;background:#0e1622;border:1px solid var(--border);border-radius:14px;padding:14px 15px;margin-bottom:12px">'+
  '<div class="label" style="color:var(--gold)">BLANTON&rsquo;S BOWL 2026</div>'+
  '<div style="font-size:16px;font-weight:900;margin:2px 0 7px">Pool Odds</div>'+
  rows.map(function(o){return line(o.name,o.p,DR_COLORS[o.idx%DR_COLORS.length],false,poolOwnerOut(ui.M,{},o.idx));}).join('')+
  line('No winner',off.none,'#8a94a4',true,poolNoneOut(ui.M,{}))+
  '<div style="font-size:9.5px;color:var(--mut);margin-top:7px;line-height:1.45">Chance to own the national champion. Model odds, '+off.sims.toLocaleString('en-US')+' simulations.<br>'+POOL_ASOF+'</div></div>';
}

/* feature 5: odds over time. One line per owner (in the owner's color) plus a dashed gray line for
   "No winner", drawn from POOL_SNAPSHOTS (official odds saved at each refresh; never what-if).
   rows = POOL_SNAPSHOTS. sel = which snapshot's numbers the legend shows (default: the latest);
   tapping a date on the chart changes it. Dates are spaced by real time, not evenly. */
function poolChartHtml(rows,sel){
 var head='<div class="ptitle" style="color:var(--purple);flex-wrap:wrap">Odds Over Time <span style="font-size:10px;color:var(--mut);font-weight:600">official odds saved at each refresh'+(rows&&rows.length>1?' &middot; tap a date':'')+'</span></div>';
 if(!rows||!rows.length)return '<div class="panel" style="padding:13px 15px;margin-bottom:12px">'+head+'<div style="font-size:11.5px;color:var(--mut);padding:10px 0 2px">No snapshots yet. The chart starts with the next refresh.</div></div>';
 var n=rows.length;if(sel===undefined||sel===null||sel<0||sel>=n)sel=n-1;
 function short(d){var p=d.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
 function dayNum(d){var p=d.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])/86400000;}
 var W=340,H=190,L=32,R=12,T=10,B=24,pw=W-L-R,ph=H-T-B;
 var d0=dayNum(rows[0][0]),d1=dayNum(rows[n-1][0]),span=Math.max(d1-d0,1);
 function x(i){return n===1?L+pw/2:L+pw*(dayNum(rows[i][0])-d0)/span;}
 var top=0;rows.forEach(function(r){r[1].forEach(function(v){if(v>top)top=v;});if(r[2]>top)top=r[2];});
 var step=top>0.5?0.25:(top>0.2?0.1:0.05),ymax=Math.max(step,Math.ceil(top/step-1e-9)*step);
 function y(v){return T+ph*(1-v/ymax);}
 var g='';
 for(var v=0;v<=ymax+1e-9;v+=step){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'" stroke="#1f2a3a" stroke-width="1"/><text x="'+(L-5)+'" y="'+(y(v)+3).toFixed(1)+'" text-anchor="end" font-size="8.5" fill="#8a94a4">'+Math.round(v*100)+'%</text>';}
 /* date labels: first, last and the selected date, skipping any that would overlap */
 var lab=[0,n-1,sel].filter(function(v2,i,a){return a.indexOf(v2)===i;}),used=[];
 lab.forEach(function(i){var xi=x(i);if(used.some(function(u){return Math.abs(u-xi)<34;}))return;used.push(xi);
  g+='<text x="'+xi.toFixed(1)+'" y="'+(H-7)+'" text-anchor="'+(n>1&&i===0?'start':(n>1&&i===n-1?'end':'middle'))+'" font-size="8.5" font-weight="'+(i===sel?'800':'500')+'" fill="'+(i===sel?'#e8ebef':'#8a94a4')+'">'+short(rows[i][0])+'</text>';});
 g+='<line x1="'+x(sel).toFixed(1)+'" x2="'+x(sel).toFixed(1)+'" y1="'+T+'" y2="'+(T+ph)+'" stroke="#3a4a66" stroke-width="1"/>';
 function series(val,c,dash){
  var pts=rows.map(function(r,i){return x(i).toFixed(1)+','+y(val(r)).toFixed(1);}).join(' ');
  return (n>1?'<polyline points="'+pts+'" fill="none" stroke="'+c+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"'+(dash?' stroke-dasharray="4 3"':'')+'/>':'')+
   '<circle cx="'+x(sel).toFixed(1)+'" cy="'+y(val(rows[sel])).toFixed(1)+'" r="4" fill="'+c+'" stroke="#141b26" stroke-width="2"/>';
 }
 g+=series(function(r){return r[2];},'#8a94a4',true);
 DRAFT.drafters.forEach(function(d,o){g+=series(function(r){return r[1][o];},DR_COLORS[o%DR_COLORS.length],false);});
 /* one invisible tap column per snapshot, wider than the marks */
 rows.forEach(function(r,i){var lo=i===0?L:(x(i-1)+x(i))/2,hi=i===n-1?W-R:(x(i)+x(i+1))/2;
  g+='<rect data-act="snap" data-i="'+i+'" x="'+lo.toFixed(1)+'" y="0" width="'+Math.max(hi-lo,1).toFixed(1)+'" height="'+H+'" fill="transparent" style="cursor:pointer"/>';});
 /* legend: always present, shows the selected date's numbers; names in normal text color */
 var order=DRAFT.drafters.map(function(d,o){return o;}).sort(function(a,b){return rows[sel][1][b]-rows[sel][1][a]||a-b;});
 function item(c,name,p,dim){return '<span style="display:flex;align-items:center;gap:6px;font-size:11px;min-width:0">'+poolDot(c)+'<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'+(dim?'color:var(--mut)':'')+'">'+name+'</span><b>'+poolPct(p)+'</b></span>';}
 var legend=order.map(function(o){return item(DR_COLORS[o%DR_COLORS.length],DRAFT.drafters[o][0],rows[sel][1][o],false);}).join('')+item('#8a94a4','No winner (dashed)',rows[sel][2],true);
 /* the same numbers as a table */
 var table='<details data-k="snaptable" style="margin:10px 0 0"><summary style="padding:9px 12px;display:flex;align-items:center;gap:8px">'+chev()+'<span style="font-size:11.5px;font-weight:700">Show as a table</span></summary><div style="overflow-x:auto;padding:0 10px 9px"><table style="font-size:10.5px;white-space:nowrap"><tr><th style="text-align:left;padding:3px 6px;color:var(--mut)">Date</th>'+
  DRAFT.drafters.map(function(d,o){return '<th style="text-align:right;padding:3px 6px">'+poolDot(DR_COLORS[o%DR_COLORS.length])+' '+d[0]+'</th>';}).join('')+'<th style="text-align:right;padding:3px 6px;color:var(--mut)">No winner</th></tr>'+
  rows.map(function(r){return '<tr style="border-top:1px solid var(--line)"><td style="padding:3px 6px;color:var(--mut)">'+short(r[0])+'</td>'+r[1].map(function(v2){return '<td style="text-align:right;padding:3px 6px">'+poolPct(v2)+'</td>';}).join('')+'<td style="text-align:right;padding:3px 6px;color:var(--mut)">'+poolPct(r[2])+'</td></tr>';}).join('')+'</table></div></details>';
 return '<div class="panel" style="padding:13px 15px;margin-bottom:12px">'+head+
  '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;margin-top:6px" role="img" aria-label="Line chart of each owner&rsquo;s official pool odds at each refresh">'+g+'</svg>'+
  '<div class="label" style="margin:6px 0 5px">'+short(rows[sel][0])+(sel===n-1?' &middot; latest':'')+'</div>'+
  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px 16px">'+legend+'</div>'+
  (n===1?'<div style="font-size:10.5px;color:var(--mut);margin-top:8px">One snapshot so far. Lines appear after the next refresh.</div>':'')+table+'</div>';
}

/* the whole tab. Each part sits in its own box so a tap can redraw just the parts that change. */
function poolTabHtml(ui){
 if(ui.M.problems.length){   // bad data: say so instead of showing made-up odds
  return '<div class="panel" style="padding:15px;border-color:var(--red)"><div class="ptitle" style="color:var(--red)">Pool Odds unavailable</div><p style="font-size:12px;margin-top:6px;line-height:1.5">The model data has a problem, so no odds are shown:</p><ul style="font-size:12px;color:var(--mut);margin:6px 0 0 16px;list-style:disc">'+ui.M.problems.map(function(p){return '<li>'+p+'</li>';}).join('')+'</ul></div>';
 }
 return '<div id="poolStrip">'+poolStripHtml(ui)+'</div>'+
  '<div id="poolOdds">'+poolOddsHtml(ui)+'</div>'+
  '<div id="poolPicker">'+poolPickerHtml(ui)+'</div>'+
  '<div id="poolMatter">'+poolMatterHtml(ui)+'</div>'+
  '<div id="poolChart">'+poolChartHtml(POOL_SNAPSHOTS)+'</div>'+
  '<div id="poolTracker">'+poolTrackerHtml(ui)+'</div>'+
  '<div id="poolCard">'+poolCardHtml(ui)+'</div>';
}

/* build the model, run the official odds once, and fill in the lookups the picker needs.
   data is optional and only used by tests (e.g. {bracket:sampleBracket}). */
function poolStart(ui,data){
 ui.M=poolBuild(data);
 ui.picks={};ui.notes=[];ui.pHome={};ui.impact={};
 if(ui.M.problems.length)return ui;
 ui.official=ui.M.run({});
 ui.current=ui.official;
 ui.official.games.forEach(function(g){ui.pHome[g.id]=g.pA;ui.impact[g.id]=g.impact;});
 /* picks start empty on every load, so this finds nothing; it is the safety net if that ever changes */
 var rec=poolReconcilePicks(ui.M,ui.picks);ui.picks=rec.picks;ui.notes=rec.notes;
 return ui;
}
/* set ui.current from ui.picks: the official result itself when there are no picks; otherwise a
   what-if run, which uses the smaller WHATIF_SIMS count so a tap answers quickly */
function poolRecalc(ui){ui.current=poolPickCount(ui.picks)?ui.M.run(ui.picks,ui.M.settings.WHATIF_SIMS):ui.official;return ui;}
/* Nothing is simulated when the page loads. The tab holds this placeholder until it is first opened. */
function poolPlaceholderHtml(){return '<div class="panel" style="padding:22px;text-align:center;color:var(--mut);font-size:12px">Pool Odds &mdash; calculating the model odds&hellip;</div>';}
/* run the official simulation and draw the tab, once */
function poolEnsureStarted(){
 if(POOL_UI.M)return;
 poolStart(POOL_UI);
 document.getElementById('tab-pool').innerHTML=poolTabHtml(POOL_UI);
 if(typeof syncStickyTop==='function')syncStickyTop();
}
/* first tap on the Pool Odds tab: let the tab switch paint first, then calculate */
function poolOpenTab(){if(!POOL_UI.M)setTimeout(poolEnsureStarted,30);}
/* after a tap: recompute what is on screen and redraw the parts that depend on picks.
   gameId (optional) = the one regular-season game just tapped: only its buttons are updated. */
function poolRedraw(gameId){
 var ui=poolRecalc(POOL_UI);
 var open={},pick=document.getElementById('poolPicker');
 document.getElementById('poolStrip').innerHTML=poolStripHtml(ui);
 document.getElementById('poolOdds').innerHTML=poolOddsHtml(ui);
 if(gameId&&!ui.M.bracket)poolTouchGame(ui,gameId);
 else{
  pick.querySelectorAll('details').forEach(function(d){open[d.getAttribute('data-k')]=d.open;});
  pick.innerHTML=poolPickerHtml(ui);
  pick.querySelectorAll('details').forEach(function(d){var k=d.getAttribute('data-k');if(k in open)d.open=open[k];});
 }
 document.getElementById('poolMatter').innerHTML=poolMatterHtml(ui);

/* one tap/change listener for the whole tab; buttons say what they do with data-act */
function poolWire(root){
 root.addEventListener('click',function(ev){
  var t=ev.target;
  while(t&&t!==root&&!(t.getAttribute&&t.getAttribute('data-act')))t=t.parentNode;
  if(!t||t===root||t.tagName==='SELECT')return;
  var ui=POOL_UI,act=t.getAttribute('data-act'),res=null;
  if(act==='snap'){   // tap a date on the odds-over-time chart: show that date's numbers
   ui.snapSel=+t.getAttribute('data-i');
   document.getElementById('poolChart').innerHTML=poolChartHtml(POOL_SNAPSHOTS,ui.snapSel);
   return;
  }
  if(act==='reset'){ui.picks={};ui.notes=[];}
  else if(act==='all'){ui.showAll=!ui.showAll;}
  else if(act==='favs'){ui.picks=poolFavoritePicks(ui);ui.notes=[];}
  else if(act==='game')res=poolPickGame(ui.M,ui.picks,t.getAttribute('data-id'),ui.M.names[+t.getAttribute('data-t')]);
  else if(act==='slot')res=poolPickBracket(ui.M,ui.picks,t.getAttribute('data-id'),ui.M.names[+t.getAttribute('data-t')]);
  else return;
  if(res){ui.picks=res.picks;ui.notes=res.ok?[]:[res.note];}
  poolRedraw(act==='game'&&res.ok?t.getAttribute('data-id'):null);
 });
 root.addEventListener('change',function(ev){
  var t=ev.target;
  if(!t||!t.getAttribute||t.getAttribute('data-act')!=='cc')return;
  var ui=POOL_UI,id=t.getAttribute('data-id'),next=poolCopy(ui.picks);
  delete next[id];ui.notes=[];
  if(t.value!==''){var res=poolPickGame(ui.M,next,id,ui.M.names[+t.value]);next=res.picks;if(!res.ok)ui.notes=[res.note];}
  ui.picks=next;
  poolRedraw();
 });
}
