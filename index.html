<style>
  :root{--bg:#0b0f16;--panel:#141b26;--panel2:#1b2433;--border:#26334a;--line:#1f2a3a;--txt:#e8ebef;--mut:#8a94a4;--cyan:#4ea1ff;--green:#36d399;--red:#ff5d6c;--gold:#f5c451;--orange:#ff9d52;--purple:#a78bfa;}
  *{-webkit-font-smoothing:antialiased;box-sizing:border-box;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;}
  .label{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700;}
  .ptitle{font-size:13px;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:7px;}
  .tabbtn{position:relative;padding:13px 4px;font-weight:700;font-size:13.5px;color:var(--mut);transition:color .2s;cursor:pointer;background:none;border:none;}
  .tabbtn.active{color:#fff;}
  .tabbtn.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2.5px;border-radius:2px;background:var(--cyan);}
  .chip{display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;letter-spacing:.03em;padding:3px 6px;border-radius:5px;color:#fff;min-width:38px;}
  .pill{font-size:9px;font-weight:800;letter-spacing:.04em;padding:3px 7px;border-radius:5px;}
  .rchip{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;border-radius:6px;font-weight:800;font-size:12px;}
  .r-hi{background:rgba(54,211,153,.16);color:#36d399;} .r-md{background:rgba(255,255,255,.08);color:#cbd3df;} .r-lo{background:rgba(255,93,108,.16);color:#ff5d6c;}
  details{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:13px;}
  summary{list-style:none;cursor:pointer;outline:none;} summary::-webkit-details-marker{display:none;}
  .chev{transition:transform .2s;} details[open] .chev{transform:rotate(90deg);}
  table{border-collapse:collapse;width:100%;} a{text-decoration:none;}
  .seclabel{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;color:#fff;padding:4px 9px;border-radius:5px;display:inline-block;margin:14px 0 8px;}
  .drafterbtn{padding:8px 15px;font-size:12.5px;font-weight:700;border-radius:20px;border:1px solid var(--border);background:var(--panel);color:var(--mut);cursor:pointer;transition:all .15s;}
  .drafterbtn.active{background:var(--cyan);color:#04121f;border-color:var(--cyan);}
</style>
</head>

 return '<details'+open+'><summary><div style="height:4px;background:'+c.b+'"></div><div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px">'+

/* ---- CFP Field Tracker (replaces preseason All-Americans, added 2026-09-05) -----------------
   Computed entirely from data already refreshed weekly for the Summary tab (CFP, AP25,
   DRAFT.drafters) — no new research needed on refresh day. Buckets each of the 21 drafted
   teams into one of three tiers:
     field   - in CFP.byes or CFP.first (the current 12-team projected field)
     bubble  - not in the field, but ranked in AP25
     outside - not in the field, not ranked
   Byes are NOT assigned a synthetic 1-4 seed number — CFP.byes doesn't rank them, so we
   don't invent an order the source data doesn't support. */
function cfpFieldTiers(){
 var byeNote={};CFP.byes.forEach(function(b){byeNote[b[0]]=b[1];});
 var firstInfo={};
 CFP.first.forEach(function(g){
  firstInfo[g[1]]={seed:g[0],opp:g[4],oppSeed:g[3],home:true};
  firstInfo[g[4]]={seed:g[3],opp:g[1],oppSeed:g[0],home:false};
 });
 var rankOf={};
 AP25.forEach(function(r){if(!(r[1] in rankOf))rankOf[r[1]]=r[0];});
 var field=[],bubble=[],outside=[];
 DRAFT.drafters.forEach(function(d){
  d[1].forEach(function(t){
   var team=t[0];
   if(!team||team==='TBD')return;
   if(byeNote[team]!==undefined){
    field.push({team:team,drafter:d[0],bye:true,note:byeNote[team]});
   }else if(firstInfo[team]){
    var fi=firstInfo[team];
    field.push({team:team,drafter:d[0],bye:false,seed:fi.seed,opp:fi.opp,oppSeed:fi.oppSeed,home:fi.home});
   }else if(rankOf[team]!==undefined){
    bubble.push({team:team,drafter:d[0],rank:rankOf[team]});
   }else{
    outside.push({team:team,drafter:d[0]});
   }
  });
 });
 field.sort(function(a,b){
  if(a.bye&&!b.bye)return -1;
  if(!a.bye&&b.bye)return 1;
  if(a.bye&&b.bye)return 0;
  return a.seed-b.seed;
 });
 bubble.sort(function(a,b){return a.rank-b.rank;});
 return {field:field,bubble:bubble,outside:outside};
}
function cfpTierRow(item,rightHtml,first){
 return '<div style="display:flex;align-items:center;gap:11px;padding:10px 14px;'+(first?'':'border-top:1px solid var(--line)')+'">'+
  tchip(item.team)+
  '<span style="font-weight:700;font-size:13px">'+item.team+'</span>'+
  '<span style="font-size:11px;color:var(--mut);margin-left:2px">'+item.drafter+'</span>'+
  '<span style="margin-left:auto;text-align:right;font-size:10.5px;color:var(--mut);line-height:1.4;max-width:220px">'+rightHtml+'</span>'+
  '</div>';
}
function cfpTierPanel(title,color,items,rowFn){
 if(!items.length)return '';
 return '<div style="display:flex;align-items:center;gap:9px;margin:22px 0 10px"><div style="width:9px;height:9px;border-radius:50%;background:'+color+'"></div>'+
  '<div style="font-size:13px;font-weight:800;letter-spacing:.03em;color:'+color+'">'+title+'</div>'+

  '<div class="panel" style="overflow:hidden">'+items.map(function(x,i){return rowFn(x,i===0);}).join('')+'</div>';
}
function cfpFieldPanel(){
 var t=cfpFieldTiers();
 var intro='<p style="font-size:11px;color:var(--mut);margin-bottom:4px">'+(CFP.note||'')+'</p>';
 var field=cfpTierPanel('IN THE FIELD','var(--green)',t.field,function(x,first){
  var right=x.bye
   ?'<span style="display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:rgba(54,211,153,.15);color:var(--green)">BYE</span><br>'+x.note
   :'<b style="color:var(--txt)">Seed '+x.seed+'</b><br>'+(x.home?'hosts':'at')+' ('+x.oppSeed+') '+x.opp;
  return cfpTierRow(x,right,first);
 });
 var bubble=cfpTierPanel('ON THE BUBBLE','var(--gold)',t.bubble,function(x,first){
  return cfpTierRow(x,'AP <b style="color:var(--txt)">No. '+x.rank+'</b>',first);
 });
 var outside=cfpTierPanel('OUTSIDE THE FIELD','var(--mut)',t.outside,function(x,first){
  return cfpTierRow(x,'Unranked',first);
 });
 return intro+field+bubble+outside;
}

/* ===== POOL MATCHUP DETECTION + STAT-STRIP COUNTS (added 2026-09-05) ===== */
/* team name -> drafter label, built once from DRAFT.drafters. Exact-key lookup,
   so "Georgia" and "Georgia Tech" never cross-match. */
var TEAM2DRAFTER={};
DRAFT.drafters.forEach(function(d){d[1].forEach(function(t){if(t[0]&&t[0]!=='TBD')TEAM2DRAFTER[t[0]]=d[0];});});

/* This week's cross-drafter pool matchups: scan PREVIEWS and OTHER for games
   where BOTH teams are drafted AND by DIFFERENT drafters (same-drafter pairs like
   Ohio State vs Penn State are excluded). This is a forward-looking teaser, so
   RECAPS is deliberately NOT scanned - RECAPS entries are completed games by
   definition (they carry final scores in sa/sb), with no reliable "is this done
   yet" signal, so they are excluded structurally rather than by a filter.
   PREVIEWS is inherently upcoming and needs no filter. Only OTHER can carry a
   just-played compact line, so the FINAL check below is specifically for OTHER
   (its time field legitimately reads e.g. "FINAL (Aug 29, Week 0)"). A matchup
   found in both PREVIEWS and OTHER is counted once. [] = none. */
function poolMatchups(){
 var seen={},out=[];
 function consider(a,b,meta){
  if(!a||!b)return;
  var da=TEAM2DRAFTER[a],db=TEAM2DRAFTER[b];
  if(!da||!db||da===db)return;
  meta=meta||'';
  if(/\bFINAL\b/i.test(meta))return; // excludes completed OTHER compact lines
  var key=[a,b].sort().join(' | ');
  if(seen[key])return;
  seen[key]=1;
  out.push({a:a,b:b,drafterA:da,drafterB:db,meta:meta.replace(/^\s*Week\s*\d+\s*\|\s*/i,'').trim()});
 }
 PREVIEWS.forEach(function(p){consider(p.a,p.b,p.meta);});
 OTHER.forEach(function(g){consider(g[0],g[1],g[2]);});
 return out;
}
var POOL_MATCHUPS=poolMatchups();

/* how many drafted teams appear in a list of team names */
function draftedCount(names){var n=0;for(var t in TEAM2DRAFTER){if(names.indexOf(t)!==-1)n++;}return n;}
var RANKED_CT=draftedCount(AP25.map(function(r){return r[1];}));
var CFP_CT=draftedCount(
 CFP.byes.map(function(b){return b[0];})
  .concat(CFP.first.map(function(g){return g[1];}))
  .concat(CFP.first.map(function(g){return g[4];}))
);

/* fill the three live-count tiles behind the kickoff tile */
STAT=[
 STAT[0]||['','','var(--cyan)'],
 [''+RANKED_CT,'teams ranked','var(--gold)'],
 [''+POOL_MATCHUPS.length,'pool matchups','var(--green)'],
 [''+CFP_CT,'in the CFP field','var(--purple)']
];

  '<div style="font-size:18px;font-weight:900">'+g.a+' <span style="color:var(--mut);font-weight:600">vs</span> '+g.b+'</div>'+
  '<div style="font-size:11px;color:var(--gold);font-weight:700;margin-top:2px">Pool Matchup &middot; '+g.drafterA+' vs '+g.drafterB+'</div>'+
  (g.meta?'<div style="font-size:10px;color:var(--mut);margin-top:2px">'+g.meta+'</div>':'')+
  '</div></div>';

function poolTeaserBlock(){

 return '<div style="display:grid;gap:10px;margin-bottom:12px">'+POOL_MATCHUPS.map(poolTeaserCard).join('')+'</div>';
